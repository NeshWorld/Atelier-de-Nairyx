[package]
name = "laboratoire-pedagogique-ia"
version = "0.1.0"
description = "Laboratoire pédagogique IA local"
authors = ["L'atelier de Nairyx"]
edition = "2021"

[lib]
name = "laboratoire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[patch.crates-io]
tauri-winres = { path = "vendor/tauri-winres" }

[workspace]
members = ["vendor/tauri-winres"]
resolver = "2"
